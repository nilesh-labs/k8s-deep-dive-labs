apiVersion : v1
kind: Pod           #type of k8s object
metadata:
  name: firstpod    # name of the pod
  labels:
    app: frontend   # Label pod with "app:frontend"
spec:
  containers:
  - name: nginx
    image: nginx:latest     # image name:image version, nginx downloads from DockerHub
    ports:
    - containerPort: 80     # Opens ports in the container
    env:
      - name: USER
        value: "username"